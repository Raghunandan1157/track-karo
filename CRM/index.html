<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14285A">
  <meta name="description" content="Track_karo CRM - customer calling feedback, response and blacklist dashboard. UI demo, no server, no database.">
  <title>Dashboard - Track_karo CRM</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/crm.css?v=9">
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Track_karo logo" width="46" height="35">
      <div>
        <span class="brand-name">Track_karo</span>
        <span class="brand-sub">CRM</span>
      </div>
    </div>

    <nav class="nav" aria-label="Sections">
      <span class="nav-label-top">Workspace</span>

      <button type="button" class="nav-item is-active" data-route="dashboard" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </button>

      <button type="button" class="nav-item" data-route="calls">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>Call log</span>
        <span class="nav-badge" id="nav-follow-badge" hidden></span>
      </button>

      <button type="button" class="nav-item" data-route="customers">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Customers</span>
      </button>

      <button type="button" class="nav-item" data-route="reports">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16V5"/></svg>
        <span>Reports</span>
      </button>

      <button type="button" class="nav-item" data-route="blacklist">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
        <span>Blacklist</span>
        <span class="nav-badge" id="nav-black-badge" hidden></span>
      </button>
    </nav>

    <div class="sidebar-note">
      <strong><span class="dot"></span> Demo mode</strong>
      This is a UI preview. All data is saved only in this browser - no server and no database.
    </div>

    <div class="sidebar-foot">
      <div class="user-chip">
        <span class="avatar avatar--navy">PR</span>
        <div>
          <strong>Priya Raman</strong>
          <small>Branch Manager</small>
        </div>
      </div>
      <button type="button" id="btn-reset" class="icon-btn" title="Reset demo data" aria-label="Reset demo data">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
    </div>
  </aside>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" id="btn-menu" class="icon-btn menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub">Calling performance at a glance</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" data-route="calls" aria-label="Open call log" title="Call log">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <span class="demo-chip"><span class="dot"></span> Demo data</span>
        <button type="button" id="btn-log-call" class="btn btn-primary btn-log-call">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">Log a call</span>
        </button>
      </div>
    </header>

    <main id="app" class="content" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button type="button" data-route="dashboard">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
      <span>Home</span>
    </button>
    <button type="button" data-route="customers">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Customers</span>
    </button>
    <span class="nav-spacer" aria-hidden="true"></span>
    <button type="button" data-route="reports">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16V5"/></svg>
      <span>Reports</span>
    </button>
    <button type="button" data-route="blacklist">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
      <span>Blacklist</span>
    </button>
    <button type="button" id="btn-fab-call" class="fab" aria-label="Log a call">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;text-align:center">This demo needs JavaScript enabled. No data leaves your browser.</p>
  </noscript>

  <script src="js/store.js?v=9"></script>
  <script src="js/ui.js?v=9"></script>
  <script src="js/views/dashboard.js?v=9"></script>
  <script src="js/views/calls.js?v=9"></script>
  <script src="js/views/customers.js?v=9"></script>
  <script src="js/views/reports.js?v=9"></script>
  <script src="js/views/blacklist.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
